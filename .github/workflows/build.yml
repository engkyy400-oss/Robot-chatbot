name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate android project
        run: |
          mkdir -p /tmp/bak
          cp pubspec.yaml /tmp/bak/pubspec.yaml
          cp lib/main.dart /tmp/bak/main.dart
          flutter create --platforms=android --org com.robot --project-name robot_chatbot .
          cp /tmp/bak/pubspec.yaml pubspec.yaml
          cp /tmp/bak/main.dart lib/main.dart
      - name: Patch manifest
        run: |
          F=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' $F
          sed -i 's#</application>#<service android:name="flutter.overlay.window.flutter_overlay_window.OverlayService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="overlay"/></service></application>#' $F
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: robot-apk
          path: build/app/outputs/flutter-apk/app-release.apk
